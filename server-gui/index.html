<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SFUサーバー管理ダッシュボード</title>
  <style>
    :root {
      --bg: #101214;
      --surface: #171a1f;
      --surface-2: #20242b;
      --surface-3: #2a3038;
      --border: rgba(255,255,255,0.1);
      --text: #eef2f5;
      --muted: #94a3b8;
      --blue: #5ab0ff;
      --green: #38d996;
      --amber: #f6c35b;
      --red: #ef5b5b;
      --violet: #a78bfa;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0;
    }

    button, select, input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .shell {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      height: 100vh;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 60px;
      padding: 0 20px;
      background: #15181d;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--blue), var(--green));
      color: #071016;
      font-weight: 800;
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.74rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.78rem;
      min-width: 112px;
      justify-content: center;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 14px currentColor;
      color: var(--red);
    }
    .dot.running { background: var(--green); color: var(--green); }
    .dot.healthy { background: var(--green); color: var(--green); }
    .dot.degraded, .dot.warming { background: var(--amber); color: var(--amber); }
    .dot.stale, .dot.offline { background: var(--red); color: var(--red); }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 13px;
      border-radius: 6px;
      color: var(--text);
      background: var(--surface-3);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 650;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn.primary { color: #061016; background: var(--green); border-color: transparent; }
    .btn.danger { color: #fff; background: var(--red); border-color: transparent; }
    .btn.ghost { background: rgba(255,255,255,0.05); }

    .tabs {
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 0 14px;
      background: #15181d;
      border-bottom: 1px solid var(--border);
      min-height: 44px;
      overflow-x: auto;
    }

    .tab {
      display: flex;
      align-items: center;
      padding: 0 14px;
      color: var(--muted);
      background: transparent;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 650;
    }
    .tab:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: -2px;
    }
    .tab.active {
      color: var(--text);
      border-color: var(--blue);
    }

    .content {
      min-height: 0;
      overflow: hidden;
    }

    .panel {
      display: none;
      height: 100%;
      min-height: 0;
      padding: 16px;
    }
    .panel.active { display: flex; flex-direction: column; }
    .panel.active.dashboard-layout { display: grid; }

    .dashboard-layout {
      grid-template-rows: auto 1fr;
      gap: 14px;
      min-height: 0;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      min-height: 78px;
      min-width: 0;
    }

    .metric-label {
      color: var(--muted);
      font-size: 0.72rem;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 1.35rem;
      font-weight: 800;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .client-grid {
      min-height: 0;
      max-height: 100%;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      align-content: start;
      gap: 12px;
      padding-right: 4px;
      overscroll-behavior: contain;
    }

    .client-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 0;
      overflow: hidden;
      content-visibility: auto;
      contain-intrinsic-size: 420px;
    }

    .client-card.healthy { border-color: rgba(56,217,150,0.45); }
    .client-card.degraded, .client-card.warming { border-color: rgba(246,195,91,0.5); }
    .client-card.stale, .client-card.offline { border-color: rgba(239,91,91,0.5); }

    .client-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.025);
    }

    .client-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-weight: 760;
    }

    .client-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .client-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.72rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .client-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }

    .mini-btn {
      min-height: 28px;
      padding: 0 9px;
      border-radius: 5px;
      background: var(--surface-3);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 700;
    }
    .mini-btn.danger { background: rgba(239,91,91,0.18); border-color: rgba(239,91,91,0.4); color: #ffb3b3; }
    .mini-btn.blue { background: rgba(90,176,255,0.15); border-color: rgba(90,176,255,0.38); color: #b8dcff; }
    .mini-btn.ok { background: rgba(56,217,150,0.14); border-color: rgba(56,217,150,0.34); color: #b8f7dc; }
    .mini-btn.warn { background: rgba(246,195,91,0.14); border-color: rgba(246,195,91,0.35); color: #ffe0a3; }

    .client-body {
      padding: 12px;
      display: grid;
      gap: 12px;
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
      gap: 8px;
    }

    .kv {
      background: rgba(255,255,255,0.045);
      border-radius: 6px;
      padding: 8px;
      min-width: 0;
    }

    .kv span {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      margin-bottom: 5px;
    }

    .kv strong {
      display: block;
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-title {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 760;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 7px;
    }

    .device-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .device-control { min-width: 0; }

    .device-control label {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      margin-bottom: 4px;
    }

    .device-control select {
      width: 100%;
      min-width: 0;
      min-height: 32px;
      color: var(--text);
      background: #11151a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 8px;
      outline: none;
      text-overflow: ellipsis;
    }
    .device-control select:disabled { color: #64748b; opacity: 0.7; }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 26px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 0.7rem;
      border: 1px solid transparent;
      max-width: 100%;
    }
    .chip.ok { color: #b8f7dc; background: rgba(56,217,150,0.12); border-color: rgba(56,217,150,0.24); }
    .chip.warn { color: #ffe0a3; background: rgba(246,195,91,0.12); border-color: rgba(246,195,91,0.28); }
    .chip.bad { color: #ffc0c0; background: rgba(239,91,91,0.12); border-color: rgba(239,91,91,0.28); }
    .chip.blue { color: #b8dcff; background: rgba(90,176,255,0.12); border-color: rgba(90,176,255,0.24); }

    .monitor-list {
      display: grid;
      gap: 6px;
      max-height: 150px;
      overflow: auto;
    }

    .monitor-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 5px 7px;
      background: rgba(255,255,255,0.035);
      border-radius: 6px;
    }

    .monitor-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.76rem;
    }

    .empty {
      color: var(--muted);
      font-size: 0.8rem;
      padding: 18px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    .log-container {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px;
      background: #050607;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .registry-wrap {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
      min-height: 0;
    }

    .registry-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .registry-form .wide-field {
      grid-column: span 2;
    }

    .registry-field {
      min-width: 0;
    }

    .registry-field label {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      margin-bottom: 5px;
    }

    .registry-field input {
      width: 100%;
      min-height: 34px;
      padding: 0 9px;
      color: var(--text);
      background: #11151a;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      min-width: 0;
    }

    .registry-field input:focus {
      border-color: rgba(90,176,255,0.55);
      box-shadow: 0 0 0 1px rgba(90,176,255,0.22);
    }

    .registry-actions {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .registry-status {
      color: var(--muted);
      font-size: 0.76rem;
      align-self: center;
    }

    .registry-grid {
      min-height: 0;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      align-content: start;
      gap: 12px;
    }

    .registered-card {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .registered-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .registered-title {
      min-width: 0;
      font-weight: 760;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .registered-meta {
      color: var(--muted);
      font-size: 0.72rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .registered-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .settings-wrap {
      max-width: 860px;
      display: grid;
      gap: 14px;
    }

    .settings-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    .settings-row label {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 8px;
    }

    .path-display {
      padding: 10px;
      background: #080a0d;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #cbd5e1;
      word-break: break-all;
      margin-bottom: 10px;
      font-size: 0.82rem;
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 12px 14px;
      }

      .top-actions {
        width: 100%;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .metrics {
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      }

      .panel {
        padding: 12px;
      }

      .client-head {
        grid-template-columns: 1fr;
      }

      .client-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">SFU</div>
        <div>
          <div class="brand-title">WebRTC 常時接続 管理ダッシュボード</div>
          <div class="brand-sub">端末状態、受信監視、デバイス制御</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="status-pill">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">停止中</span>
        </div>
        <button id="startBtn" class="btn primary">起動</button>
        <button id="stopBtn" class="btn danger">停止</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Server dashboard sections">
      <button type="button" class="tab active" data-target="dashboard" role="tab" aria-selected="true" aria-controls="dashboard">ダッシュボード</button>
      <button type="button" class="tab" data-target="clients" role="tab" aria-selected="false" aria-controls="clients">接続端末</button>
      <button type="button" class="tab" data-target="registered" role="tab" aria-selected="false" aria-controls="registered">事前登録</button>
      <button type="button" class="tab" data-target="logs" role="tab" aria-selected="false" aria-controls="logs">ログ</button>
      <button type="button" class="tab" data-target="settings" role="tab" aria-selected="false" aria-controls="settings">設定</button>
    </nav>

    <main class="content">
      <section id="dashboard" class="panel active dashboard-layout" role="tabpanel">
        <div class="metrics">
          <div class="metric"><div class="metric-label">接続端末</div><div class="metric-value" id="mPeers">0</div><div class="metric-note" id="mHealth">待機中</div></div>
          <div class="metric"><div class="metric-label">映像・音声配信</div><div class="metric-value" id="mStreams">0 / 0</div><div class="metric-note">送信 / 受信</div></div>
          <div class="metric"><div class="metric-label">受信確認OK</div><div class="metric-value" id="mReceive">0</div><div class="metric-note">クライアント側監視</div></div>
          <div class="metric"><div class="metric-label">サーバーIP</div><div class="metric-value" id="mCurrentIp">-</div><div class="metric-note" id="mAnnounced">ANNOUNCED_IP</div></div>
          <div class="metric"><div class="metric-label">メモリ</div><div class="metric-value" id="mMemory">0 MB</div><div class="metric-note" id="mUptime">起動時間 0s</div></div>
          <div class="metric"><div class="metric-label">CPU</div><div class="metric-value" id="mCpu">0.0%</div><div class="metric-note" id="mRtcPorts">RTP -</div></div>
          <div class="metric"><div class="metric-label">一括操作</div><button id="restartAllBtn" class="btn danger" style="width:100%; margin-top:4px;">全端末を再構築</button><div class="metric-note">接続中の全クライアント</div></div>
        </div>
        <div id="clientCards" class="client-grid">
          <div class="empty">サーバー起動後、接続端末の状態がここに表示されます</div>
        </div>
      </section>

      <section id="clients" class="panel" role="tabpanel" hidden>
        <div id="clientCardsFull" class="client-grid"></div>
      </section>

      <section id="registered" class="panel" role="tabpanel" hidden>
        <div class="registry-wrap">
          <div class="registry-form">
            <div class="registry-field">
              <label>管理名</label>
              <input id="regName" placeholder="例: サテライト">
            </div>
            <div class="registry-field">
              <label>クライアントIP / ホスト</label>
              <input id="regHost" placeholder="例: 192.168.10.24">
            </div>
            <div class="registry-field">
              <label>管理ポート</label>
              <input id="regPort" value="39210">
            </div>
            <div class="registry-field">
              <label>管理トークン</label>
              <input id="regToken" type="password" placeholder="未設定なら空欄">
            </div>
            <div class="registry-field">
              <label>クライアント拠点名</label>
              <input id="regLocation" placeholder="例: サテライト">
            </div>
            <div class="registry-field">
              <label>接続先SFU IP</label>
              <input id="regServerIp" placeholder="ANNOUNCED_IP">
            </div>
            <div class="registry-field">
              <label>接続先SFU Port</label>
              <input id="regServerPort" value="3000">
            </div>
            <div class="registry-actions">
              <button id="regAddBtn" class="btn primary">登録</button>
              <button id="regReloadBtn" class="btn ghost">再読み込み</button>
              <span id="regStatus" class="registry-status"></span>
            </div>
          </div>
          <div id="registeredClients" class="registry-grid">
            <div class="empty">遠隔操作するクライアントを登録できます</div>
          </div>
        </div>
      </section>

      <section id="logs" class="panel" role="tabpanel" hidden>
        <div class="log-container" id="logOutput">=== SFUサーバーログ ===</div>
      </section>

      <section id="settings" class="panel" role="tabpanel" hidden>
        <div class="settings-wrap">
          <div class="settings-row">
            <label>サーバー実行フォルダ</label>
            <div class="path-display" id="pathDisplay">内蔵サーバーを使用します</div>
            <button class="btn ghost" id="selectBtn">外部サーバーフォルダを選択</button>
            <button class="btn ghost" id="useBundledBtn">内蔵サーバーに戻す</button>
          </div>
          <div class="settings-row">
            <label>内蔵サーバー .env</label>
            <div class="path-display" id="envDisplay">Loading...</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const selectBtn = document.getElementById('selectBtn');
    const useBundledBtn = document.getElementById('useBundledBtn');
    const restartAllBtn = document.getElementById('restartAllBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const logOutput = document.getElementById('logOutput');
    const pathDisplay = document.getElementById('pathDisplay');
    const envDisplay = document.getElementById('envDisplay');
    const clientCards = document.getElementById('clientCards');
    const clientCardsFull = document.getElementById('clientCardsFull');
    const registeredClientsEl = document.getElementById('registeredClients');
    const regName = document.getElementById('regName');
    const regHost = document.getElementById('regHost');
    const regPort = document.getElementById('regPort');
    const regToken = document.getElementById('regToken');
    const regLocation = document.getElementById('regLocation');
    const regServerIp = document.getElementById('regServerIp');
    const regServerPort = document.getElementById('regServerPort');
    const regAddBtn = document.getElementById('regAddBtn');
    const regReloadBtn = document.getElementById('regReloadBtn');
    const regStatus = document.getElementById('regStatus');

    let currentServerPath = localStorage.getItem('sfuServerPath') || '';
    let latestStats = null;
    let deferredCardStats = null;
    let lastCardsHtml = '';
    let deviceSelectHoldUntil = 0;
    let registeredClients = [];
    pathDisplay.innerText = currentServerPath || '内蔵サーバーを使用します';

    const healthText = {
      healthy: '正常',
      degraded: '注意',
      warming: '準備中',
      stale: '応答なし',
      offline: '切断',
    };

    function activateTab(target) {
      const nextPanel = document.getElementById(target);
      if (!nextPanel) return;

      document.querySelectorAll('.tab').forEach(tab => {
        const selected = tab.dataset.target === target;
        tab.classList.toggle('active', selected);
        tab.setAttribute('aria-selected', String(selected));
      });

      document.querySelectorAll('.panel').forEach(panel => {
        const selected = panel.id === target;
        panel.classList.toggle('active', selected);
        panel.hidden = !selected;
      });
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activateTab(tab.dataset.target);
      });
    });

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }

    function fmtMs(ms) {
      if (ms == null) return '-';
      if (ms < 1000) return `${Math.max(0, Math.round(ms))}ms`;
      return `${Math.round(ms / 1000)}s`;
    }

    function fmtUptime(sec) {
      const s = Number(sec) || 0;
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m ${s % 60}s`;
    }

    function shortId(id) {
      return String(id || '').slice(0, 8);
    }

    function setRegistryStatus(message, tone = 'muted') {
      regStatus.innerText = message || '';
      regStatus.style.color =
        tone === 'ok' ? 'var(--green)' :
        tone === 'bad' ? 'var(--red)' :
        tone === 'warn' ? 'var(--amber)' :
        'var(--muted)';
    }

    function defaultRegistryServerIp() {
      return latestStats?.currentIp || latestStats?.announcedIp || '';
    }

    function defaultRegistryServerPort() {
      return String(latestStats?.listenPort || '3000');
    }

    function refreshRegistryDefaults() {
      if (!regServerIp.value && defaultRegistryServerIp()) regServerIp.value = defaultRegistryServerIp();
      if (!regServerPort.value) regServerPort.value = defaultRegistryServerPort();
    }

    function registeredStatusChip(client) {
      const status = client.lastStatus || 'unknown';
      const cls =
        status === 'online' || status === 'configured' ? 'ok' :
        status === 'offline' ? 'bad' :
        'warn';
      return `<span class="chip ${cls}">${escapeHtml(status)}</span>`;
    }

    function renderRegisteredClients() {
      if (!registeredClients.length) {
        registeredClientsEl.innerHTML = '<div class="empty">遠隔操作するクライアントを登録できます</div>';
        return;
      }
      registeredClientsEl.innerHTML = registeredClients.map(client => `
        <article class="registered-card">
          <div class="registered-head">
            <div style="min-width:0">
              <div class="registered-title">${escapeHtml(client.name || client.host)}</div>
              <div class="registered-meta">${escapeHtml(client.host)}:${escapeHtml(client.port)} / ${escapeHtml(client.locationName || '-')}</div>
            </div>
            ${registeredStatusChip(client)}
          </div>
          <div class="chip-row">
            <span class="chip blue">SFU ${escapeHtml(client.serverIp || '-')}:${escapeHtml(client.serverPort || '-')}</span>
            <span class="chip ${client.hasToken ? 'ok' : 'warn'}">${client.hasToken ? 'token' : 'open'}</span>
          </div>
          ${client.lastError ? `<div class="registered-meta" style="color:var(--red)">${escapeHtml(client.lastError)}</div>` : ''}
          <div class="registered-actions">
            <button class="mini-btn blue" data-reg-action="probe" data-id="${escapeHtml(client.id)}">疎通確認</button>
            <button class="mini-btn blue" data-reg-action="configure" data-id="${escapeHtml(client.id)}">設定送信</button>
            <button class="mini-btn danger" data-reg-action="restart" data-id="${escapeHtml(client.id)}">再構築</button>
            <button class="mini-btn" data-reg-action="remove" data-id="${escapeHtml(client.id)}">削除</button>
          </div>
        </article>
      `).join('');
    }

    async function loadRegisteredClients() {
      try {
        registeredClients = await window.api.listRegisteredClients();
        renderRegisteredClients();
        refreshRegistryDefaults();
      } catch (err) {
        setRegistryStatus(err.message || '登録一覧を取得できません', 'bad');
      }
    }

    function updateRegisteredClient(client) {
      registeredClients = registeredClients.filter(item => item.id !== client.id);
      registeredClients.push(client);
      renderRegisteredClients();
    }

    function registryPayload() {
      const name = regName.value.trim();
      return {
        name,
        host: regHost.value.trim(),
        port: regPort.value.trim() || '39210',
        token: regToken.value,
        locationName: regLocation.value.trim() || name,
        serverIp: regServerIp.value.trim() || defaultRegistryServerIp(),
        serverPort: regServerPort.value.trim() || defaultRegistryServerPort(),
      };
    }

    function deviceOptions(devices, selected, label) {
      if (!Array.isArray(devices) || devices.length === 0) {
        return `<option value="">${label}なし</option>`;
      }
      return devices.map(device => {
        const value = escapeHtml(device.deviceId);
        const text = escapeHtml(device.label || device.kind || 'デバイス');
        const active = device.deviceId === selected ? 'selected' : '';
        return `<option value="${value}" ${active}>${text}</option>`;
      }).join('');
    }

    function mediaChip(label, ok, warn = false) {
      const cls = ok ? 'ok' : (warn ? 'warn' : 'bad');
      return `<span class="chip ${cls}">${escapeHtml(label)}</span>`;
    }

    function mediaToggleButton(socketId, kind, label, enabled, disabled = false) {
      const nextEnabled = !enabled;
      const tone = enabled ? 'warn' : 'ok';
      const suffix = enabled ? 'OFF' : 'ON';
      return `
        <button
          class="mini-btn ${tone}"
          data-action="media-state"
          data-socket="${escapeHtml(socketId)}"
          data-kind="${escapeHtml(kind)}"
          data-enabled="${String(nextEnabled)}"
          ${disabled ? 'disabled' : ''}
        >${escapeHtml(label)} ${suffix}</button>
      `;
    }

    function monitorRows(client) {
      const peers = client.remoteMonitor?.peers || [];
      if (!peers.length) return '<div class="empty">受信モニターなし</div>';
      return `<div class="monitor-list">${peers.map(peer => `
        <div class="monitor-row">
          <div class="monitor-name">${escapeHtml(peer.name || peer.socketId || 'unknown')}</div>
          ${mediaChip('映像', !!peer.receivingVideo, !!peer.videoPaused)}
          ${mediaChip('音声', !!peer.receivingAudio, !!peer.audioPaused)}
        </div>
      `).join('')}</div>`;
    }

    function clientCard(client) {
      const devices = client.devices || {};
      const selected = client.selectedDevices || {};
      const local = client.localMedia || {};
      const remote = client.remoteMonitor || {};
      const transports = client.transports || {};
      const isViewer = client.appType === 'viewer';
      const health = client.health || 'warming';
      const videoDisabled = isViewer || !(devices.video || []).length;
      const micDisabled = isViewer || !(devices.audioInput || []).length;
      const speakerDisabled = !(devices.audioOutput || []).length;
      const recvOk = (remote.receivingVideoCount || 0) + (remote.receivingAudioCount || 0);

      return `
        <article class="client-card ${escapeHtml(health)}">
          <div class="client-head">
            <div>
              <div class="client-title">
                <span class="dot ${escapeHtml(health)}"></span>
                <span class="client-name">${escapeHtml(client.name || '不明')}</span>
                <span class="chip blue">${escapeHtml(client.appType || 'client')}</span>
              </div>
              <div class="client-meta">${escapeHtml(shortId(client.id))} / ${escapeHtml(client.remoteAddress || '-')}</div>
            </div>
            <div class="client-actions">
              <button class="mini-btn blue" data-action="refresh" data-socket="${escapeHtml(client.id)}">デバイス更新</button>
              <button class="mini-btn danger" data-action="restart" data-socket="${escapeHtml(client.id)}">再構築</button>
              <button class="mini-btn" data-action="kick" data-socket="${escapeHtml(client.id)}">切断</button>
            </div>
          </div>
          <div class="client-body">
            <div class="kv-grid">
              <div class="kv"><span>状態</span><strong>${escapeHtml(healthText[health] || health)}</strong></div>
              <div class="kv"><span>最終応答</span><strong>${fmtMs(client.heartbeatAgeMs)}</strong></div>
              <div class="kv"><span>RTT</span><strong>${fmtMs(client.rttMs)}</strong></div>
              <div class="kv"><span>受信OK</span><strong>${recvOk}</strong></div>
            </div>

            <div>
              <div class="section-title">メディア状態</div>
              <div class="chip-row">
                ${mediaChip('カメラ', !!local.cameraEnabled && local.video?.readyState === 'live', !local.cameraEnabled)}
                ${mediaChip('マイク', !!local.micEnabled && local.audio?.readyState === 'live', !local.micEnabled)}
                ${mediaChip('スピーカー', !local.speakerMuted, !!local.speakerMuted)}
                <span class="chip blue">送信 ${escapeHtml(transports.sendState || 'none')}</span>
                <span class="chip blue">受信 ${escapeHtml(transports.recvState || 'none')}</span>
              </div>
            </div>

            <div>
              <div class="section-title">ON/OFF制御</div>
              <div class="chip-row">
                ${mediaToggleButton(client.id, 'camera', 'カメラ', !!local.cameraEnabled, isViewer)}
                ${mediaToggleButton(client.id, 'mic', 'マイク', !!local.micEnabled, isViewer)}
                ${mediaToggleButton(client.id, 'speaker', 'スピーカー', !local.speakerMuted)}
              </div>
            </div>

            <div>
              <div class="section-title">デバイス選択</div>
              <div class="device-grid">
                <div class="device-control">
                  <label>カメラ</label>
                  <select data-action="device" data-socket="${escapeHtml(client.id)}" data-kind="video" ${videoDisabled ? 'disabled' : ''}>
                    ${deviceOptions(devices.video, selected.video, 'カメラ')}
                  </select>
                </div>
                <div class="device-control">
                  <label>マイク</label>
                  <select data-action="device" data-socket="${escapeHtml(client.id)}" data-kind="audioInput" ${micDisabled ? 'disabled' : ''}>
                    ${deviceOptions(devices.audioInput, selected.audioInput, 'マイク')}
                  </select>
                </div>
                <div class="device-control">
                  <label>スピーカー</label>
                  <select data-action="device" data-socket="${escapeHtml(client.id)}" data-kind="audioOutput" ${speakerDisabled ? 'disabled' : ''}>
                    ${deviceOptions(devices.audioOutput, selected.audioOutput, 'スピーカー')}
                  </select>
                </div>
              </div>
            </div>

            <div>
              <div class="section-title">クライアント受信モニター</div>
              ${monitorRows(client)}
            </div>
          </div>
        </article>
      `;
    }

    function holdClientCardRender(ms = 8000) {
      deviceSelectHoldUntil = Math.max(deviceSelectHoldUntil, Date.now() + ms);
    }

    function isDeviceSelectActive() {
      const active = document.activeElement;
      return Date.now() < deviceSelectHoldUntil ||
        !!active?.matches?.('select[data-action="device"]');
    }

    function renderClientCards(stats) {
      const clients = stats.clients || [];
      const html = clients.length
        ? clients.map(clientCard).join('')
        : '<div class="empty">接続端末がありません</div>';
      if (html === lastCardsHtml) return;
      lastCardsHtml = html;
      clientCards.innerHTML = html;
      clientCardsFull.innerHTML = html;
    }

    function flushDeferredCardStats() {
      if (!deferredCardStats || isDeviceSelectActive()) return;
      const stats = deferredCardStats;
      deferredCardStats = null;
      renderClientCards(stats);
    }

    function renderStats(stats) {
      latestStats = stats;
      const clients = stats.clients || [];
      const health = stats.healthCounts || {};
      const receiveOk = clients.reduce((sum, client) => {
        const remote = client.remoteMonitor || {};
        return sum + (remote.receivingVideoCount || 0) + (remote.receivingAudioCount || 0);
      }, 0);

      document.getElementById('mPeers').innerText = stats.peerCount ?? 0;
      document.getElementById('mHealth').innerText = `正常 ${health.healthy || 0} / 注意 ${(health.degraded || 0) + (health.warming || 0)} / 応答なし ${(health.stale || 0) + (health.offline || 0)}`;
      document.getElementById('mStreams').innerText = `${stats.totalProducers || 0} / ${stats.totalConsumers || 0}`;
      document.getElementById('mReceive').innerText = receiveOk;
      document.getElementById('mCurrentIp').innerText = stats.currentIp || stats.announcedIp || '-';
      document.getElementById('mMemory').innerText = `${Math.round((stats.memory || 0) / 1024 / 1024)} MB`;
      document.getElementById('mUptime').innerText = `起動時間 ${fmtUptime(stats.uptimeSec || 0)}`;
      document.getElementById('mCpu').innerText = `${stats.cpu || '0.0'}%`;
      document.getElementById('mAnnounced').innerText = `公開IP ${stats.announcedIp || '-'} / 実IP ${(stats.serverIps || []).join(', ') || '-'}`;
      document.getElementById('mRtcPorts').innerText = `RTP ${stats.rtcPortRange?.min || '-'}-${stats.rtcPortRange?.max || '-'}`;
      refreshRegistryDefaults();

      if (isDeviceSelectActive()) {
        deferredCardStats = stats;
      } else {
        deferredCardStats = null;
        renderClientCards(stats);
      }
    }

    function resetStats() {
      renderStats({
        peerCount: 0,
        totalProducers: 0,
        totalConsumers: 0,
        memory: 0,
        uptimeSec: 0,
        cpu: '0.0',
        clients: [],
        healthCounts: {},
      });
    }

    function appendLog(log) {
      const p = document.createElement('div');
      p.innerText = String(log || '').trim();
      if (/ERROR|error|failed|失敗/.test(p.innerText)) p.style.color = 'var(--red)';
      if (/WARN|注意|timeout/.test(p.innerText)) p.style.color = 'var(--amber)';
      if (p.innerText.includes('[Admin]')) p.style.color = 'var(--blue)';
      logOutput.appendChild(p);
      logOutput.scrollTop = logOutput.scrollHeight;
      if (logOutput.childNodes.length > 2000) logOutput.removeChild(logOutput.firstChild);
    }

    function wireClientActions(container) {
      container.addEventListener('click', event => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const socketId = button.dataset.socket;
        const action = button.dataset.action;
        if (action === 'restart' && confirm(`クライアント ${socketId} を再起動しますか？`)) {
          window.api.restartClient(socketId);
        }
        if (action === 'kick' && confirm(`クライアント ${socketId} を切断しますか？`)) {
          window.api.kickClient(socketId);
        }
        if (action === 'media-state') {
          holdClientCardRender(1500);
          window.api.setClientMediaState(socketId, button.dataset.kind, button.dataset.enabled === 'true');
          setTimeout(flushDeferredCardStats, 1600);
        }
        if (action === 'refresh') {
          window.api.refreshClientDevices(socketId);
        }
      });

      container.addEventListener('change', event => {
        const select = event.target.closest('select[data-action="device"]');
        if (!select) return;
        holdClientCardRender(1200);
        window.api.setClientDevice(select.dataset.socket, select.dataset.kind, select.value);
        setTimeout(flushDeferredCardStats, 1300);
      });

      container.addEventListener('focusin', event => {
        if (event.target.closest('select[data-action="device"]')) holdClientCardRender();
      });

      container.addEventListener('pointerdown', event => {
        if (event.target.closest('select[data-action="device"]')) holdClientCardRender();
      });

      container.addEventListener('focusout', event => {
        if (!event.target.closest('select[data-action="device"]')) return;
        deviceSelectHoldUntil = Math.max(deviceSelectHoldUntil, Date.now() + 250);
        setTimeout(flushDeferredCardStats, 300);
      });
    }

    wireClientActions(clientCards);
    wireClientActions(clientCardsFull);
    loadRegisteredClients();

    regAddBtn.addEventListener('click', async () => {
      try {
        setRegistryStatus('saving...');
        const saved = await window.api.saveRegisteredClient(registryPayload());
        updateRegisteredClient(saved);
        regHost.value = '';
        regToken.value = '';
        if (!regLocation.value) regName.value = '';
        setRegistryStatus('registered', 'ok');
      } catch (err) {
        setRegistryStatus(err.message || '登録に失敗しました', 'bad');
      }
    });

    regReloadBtn.addEventListener('click', () => {
      setRegistryStatus('reloading...');
      loadRegisteredClients().then(() => setRegistryStatus('loaded', 'ok'));
    });

    registeredClientsEl.addEventListener('click', async event => {
      const button = event.target.closest('button[data-reg-action]');
      if (!button) return;
      const id = button.dataset.id;
      const action = button.dataset.regAction;
      button.disabled = true;
      try {
        if (action === 'probe') {
          setRegistryStatus('probing...');
          const result = await window.api.probeRegisteredClient(id);
          updateRegisteredClient(result.client);
          setRegistryStatus(result.error ? `offline: ${result.error}` : 'online', result.error ? 'bad' : 'ok');
        }
        if (action === 'configure') {
          setRegistryStatus('pushing config...');
          const target = registeredClients.find(client => client.id === id);
          const result = await window.api.configureRegisteredClient(id, {
            serverIp: target?.serverIp || defaultRegistryServerIp(),
            serverPort: target?.serverPort || defaultRegistryServerPort(),
            locationName: target?.locationName || target?.name,
          });
          updateRegisteredClient(result.client);
          setRegistryStatus('config pushed', 'ok');
        }
        if (action === 'restart') {
          if (!confirm('登録クライアントへ再起動指示を送信しますか？')) return;
          setRegistryStatus('sending restart...');
          const result = await window.api.restartRegisteredClient(id);
          updateRegisteredClient(result.client);
          setRegistryStatus('restart sent', 'ok');
        }
        if (action === 'remove') {
          if (!confirm('登録クライアントを削除しますか？')) return;
          await window.api.removeRegisteredClient(id);
          registeredClients = registeredClients.filter(client => client.id !== id);
          renderRegisteredClients();
          setRegistryStatus('removed', 'ok');
        }
      } catch (err) {
        setRegistryStatus(err.message || '操作に失敗しました', 'bad');
      } finally {
        button.disabled = false;
      }
    });

    window.api.getServerInfo().then(info => {
      envDisplay.innerText = info.defaultEnvPath || 'Unknown';
    }).catch(() => {
      envDisplay.innerText = 'Unknown';
    });

    selectBtn.addEventListener('click', async () => {
      const folder = await window.api.selectFolder();
      if (folder) {
        currentServerPath = folder;
        localStorage.setItem('sfuServerPath', folder);
        pathDisplay.innerText = folder;
      }
    });

    useBundledBtn.addEventListener('click', () => {
      currentServerPath = '';
      localStorage.removeItem('sfuServerPath');
      pathDisplay.innerText = '内蔵サーバーを使用します';
    });

    startBtn.addEventListener('click', () => window.api.startServer(currentServerPath));
    stopBtn.addEventListener('click', () => window.api.stopServer());

    restartAllBtn.addEventListener('click', () => {
      if (!confirm('全クライアントへ再起動指示を送信しますか？')) return;
      restartAllBtn.disabled = true;
      restartAllBtn.innerText = '送信中...';
      window.api.restartAll();
      setTimeout(() => {
        restartAllBtn.disabled = false;
        restartAllBtn.innerText = '全端末を再構築';
      }, 6000);
    });

    window.api.onServerStatus((status) => {
      statusText.innerText = status === 'Running' ? '稼働中' : '停止中';
      statusDot.classList.toggle('running', status === 'Running');
      if (status !== 'Running') resetStats();
    });

    window.api.onServerLog(appendLog);
    window.api.onServerStats(renderStats);

    resetStats();
  </script>
</body>
</html>
